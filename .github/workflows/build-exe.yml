name: Build Dictaphone Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Dictaphone.exe (Windows 64-bit)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable via PyInstaller
        run: |
          python build.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictaphone-Windows-x64
          path: dist/Dictaphone.exe
          if-no-files-found: error

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Dictaphone.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
